<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; script-src 'self'">
<title>Terminal — Terminus</title>
<link rel="stylesheet" href="../design/fontes.css">
<link rel="stylesheet" href="../design/estilo-da-casca.css">
</head>
<body class="soTerminal">

<!-- A janela do terminal solto (ADR 0031).
     Os mesmos ids do painel da casca, de propósito: assim `linha-de-comando.ts`
     e `tela-do-terminal.ts` rodam aqui sem uma linha de diferença. Página nova
     com nomes novos obrigaria a manter duas versões da mesma coisa. -->
<aside class="painelTerm" id="painel">
  <div class="ptabs" id="cabTerm">
    <span class="pt on">Terminal</span>
    <span class="r">
      <button id="btParar" title="Parar" disabled>&#9632;</button>
      <button id="btLimpar" title="Limpar">&#9645;</button>
      <button id="btVoltarParaCasca" title="Devolver o terminal para a janela do Terminus">&#8600;</button>
    </span>
  </div>
  <div class="term" id="term"></div>
  <form class="linhaCmd" id="linhaCmd" autocomplete="off">
    <span class="promptCmd" id="promptCmd">&#10148;</span>
    <input id="entradaCmd" type="text" spellcheck="false" autocapitalize="off"
           placeholder="pip install pandas" aria-label="Comando" />
  </form>
</aside>

<script type="module" src="./casca-do-terminal.ts"></script>
</body>
</html>
