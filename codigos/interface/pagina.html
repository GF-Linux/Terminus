<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:; script-src 'self'; worker-src 'self' blob:; connect-src 'self' data:">
<!-- ⚠️ `connect-src 'self' data:` ENTROU EM 26/08, e não é relaxamento de fachada.
     MEDIDO: o console dizia *"Refused to connect to 'data:application/json;base64,…'
     because it violates the document's Content Security Policy"* — e o que estava sendo
     recusado eram os MANIFESTOS das extensões de linguagem (Python Language Basics, C#
     Language Basics), que o empacotador inlina como `data:` dentro do próprio pacote.
     Sem eles o registro de linguagem nasce incompleto, e o sintoma é um servidor de
     linguagem de pé e mudo.
     O QUE ISTO ABRE, dito por inteiro: `data:` é conteúdo que já está DENTRO da página —
     não sai da máquina, não tem servidor do outro lado, não pode exfiltrar. O que
     continua barrado é o que importa: `connect-src` **não** ganhou `https:` nem `*`, e a
     tela segue sem poder falar com a rede. Quem sai da máquina é o `main`, e só ele.
     `worker-src 'self' blob:` pela mesma razão medida: o empacotador cria worker por
     blob em alguns caminhos, e sem isto ele falha em silêncio. -->
<title>Terminus</title>
<link rel="stylesheet" href="../design/fontes.css">
<link rel="stylesheet" href="../design/estilo-da-casca.css">
</head>
<body>

<div class="ide">

  <!-- Barra de título (ADR 0027): o fluxo à esquerda, os controles da janela na
       outra ponta. Os círculos saíram do canto esquerdo — ali fica o que se usa,
       não o que fecha o aplicativo. -->
  <div class="tbar" id="tbar">
    <button class="fluxo" id="btFluxo" title="Linguagem do trabalho — clique para começar um projeto">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v16M4 8h16M4 16h16"/></svg>
      <span id="rotuloFluxo">Fluxo</span>
    </button>
    <!-- Rodar (ADR 0030): uma linha só, escolhida olhando a pasta. Nasce
         desligado, e acende quando o fluxo é conhecido. -->
    <button class="fluxo rodar" id="btRodar" disabled title="Rodar este projeto">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5l12 7.5-12 7.5z"/></svg>
      <span>Rodar</span>
    </button>
    <div class="doc" id="tituloDoc">Terminus</div>
    <div class="lights">
      <button class="c2" id="btMinimizar" title="Minimizar"></button>
      <button class="c3" id="btMaximizar" title="Maximizar"></button>
      <button class="c1" id="btFechar" title="Fechar"></button>
    </div>
  </div>

  <!-- Menu do fluxo. Separado do #menu da árvore de propósito: aquele carrega
       o caminho clicado em data-alvo, e este não tem alvo nenhum. -->
  <div class="menu oculto" id="menuFluxo"></div>
  <div class="menu oculto" id="menuGithub"></div>

  <div class="main">

    <!-- Explorer / Extensões / Configurações. O terceiro ícone era "Plugins do
         Neovim", saiu com o motor em 26/08 e VOLTOU no mesmo dia com outro
         conteúdo: as extensões que a pessoa já usa no VSCode, lidas do disco. -->
    <nav class="act" id="act" aria-label="Barra de atividades">
      <button data-p="explorer" aria-selected="true" title="Explorer">
        <svg viewBox="0 0 24 24"><path d="M4 6h5.5l1.8 2H20v11H4z"/></svg></button>
      <button data-p="extensions" aria-selected="false" title="Extensões do VSCode">
        <svg viewBox="0 0 24 24"><path d="M4 4h6.5v6.5H4zM13.5 13.5H20V20h-6.5zM13.5 4H20v6.5h-6.5zM4 13.5h6.5V20H4z"/></svg></button>
      <button class="sp" data-p="config" aria-selected="false" title="Configurações">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="2.8"/><path d="M12 3.4v2.3M12 18.3v2.3M3.4 12h2.3M18.3 12h2.3M6 6l1.6 1.6M16.4 16.4L18 18M18 6l-1.6 1.6M7.6 16.4L6 18"/></svg></button>
    </nav>

    <aside class="side" id="side">
      <div class="hd">
        <span id="sideT">Explorer</span>
        <span class="acoes" id="sideAcoes"></span>
      </div>
      <div class="body" id="lateral"></div>
    </aside>
    <!-- Clicar de novo no ícone já selecionado fecha a lateral (Ctrl+B); o
         divisor ajusta a largura. -->
    <div class="divv" id="divLateral" role="separator" aria-orientation="vertical"
         title="Arraste para redimensionar (duplo clique volta ao padrão)"></div>

    <!-- Área central: editor + terminal dockável (ADR 0025). O #centro troca a
         direção do flex conforme a doca (direita / esquerda / baixo). -->
    <div class="centro" id="centro" data-doca="direita">
    <div class="stage" id="stage">
      <!-- Papel de parede: só atrás da área de escrita, nunca atrás da casca. -->
      <div class="fundoTela oculto" id="fundoTela"></div>

      <!-- As abas. Nascem ocultas e aparecem com o primeiro arquivo aberto: o
           Monaco edita um modelo por vez e não sabe que existem outros — abas
           são do workbench, e o workbench não vem no pacote. -->
      <div class="abas oculto" id="abas"></div>
      <!-- A tela inicial é desenhada por `interface/tela-inicial.ts`, com as cores do
           `kits/editor/tema.lua`. Ela nasce vazia aqui de propósito: as cores vêm do kit,
           e repeti-las no HTML criaria a segunda lista que este projeto evita. -->
      <div class="vazio" id="vazio"></div>

    </div>

    <!-- Fechado por padrão: divulgação progressiva. Abre no Ctrl+` , no botão da
         barra de estado, ou sozinho quando há saída para mostrar. A doca (rodapé,
         direita ou esquerda) fica lembrada entre sessões. -->
    <div class="divv oculto" id="divTerm" role="separator" aria-orientation="vertical"
         title="Arraste para redimensionar (duplo clique volta ao padrão)"></div>
    <aside class="painelTerm oculto" id="painel">
      <div class="ptabs" id="cabTerm" title="Arraste para mudar a doca">
        <span class="pt on">Terminal</span>
        <span class="r">
          <button id="btDocaBaixo" class="doca" title="Terminal no rodapé">&#9601;</button>
          <button id="btDocaDireita" class="doca" title="Terminal à direita">&#9621;</button>
          <button id="btDocaEsquerda" class="doca" title="Terminal à esquerda">&#9615;</button>
          <button id="btSoltarTerminal" title="Abrir o Konsole nesta pasta">&#8599;</button>
          <button id="btLimpar" title="Limpar">&#9645;</button>
          <button id="btFecharPainel" title="Fechar painel">&#10005;</button>
        </span>
      </div>
      <!-- Aqui dentro se digita, desde 19/08. Havia um <input> logo abaixo,
           porque sem PTY não existia eco nem readline do outro lado e escrever
           no xterm obrigaria a reimplementar cursor, histórico e edição de linha
           à mão. Com um shell de verdade quem faz isso é o readline do bash — o
           mesmo do Konsole, e com o que a nossa cópia não tinha: Tab completa,
           Ctrl+R procura no histórico, Ctrl+A e Ctrl+E andam na linha.
           O botão ■ saiu junto: parar agora é Ctrl+C, dentro do terminal. -->
      <div class="term" id="term"></div>
    </aside>
    </div><!-- /centro -->

  </div>

  <!-- Barra inferior: terminal, atalhos Git e a marca do dono. -->
  <div class="sbar">
    <button id="btPainel" title="Terminal (Ctrl+`)">Terminal</button>
    <button id="btGithub" title="Atalhos Git">GitHub</button>
    <!-- O Copilot: estado, não botão. `pronto: false` é o caso mais comum de
         todos (servidor ainda subindo, sessão expirada, binário ausente), e sem
         este indicador a sugestão simplesmente nunca apareceria, sem dizer por
         quê. O `title` carrega a frase inteira do que falta. -->
    <span class="copiloto" id="copiloto" title="">Copilot</span>
    <span class="r">
      <a id="linkGithub" class="gh" href="#" title="Abrir o GitHub no navegador">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38
          0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95
          0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.4 7.4 0 014 0c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48
          0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
        <span id="nomeGithub">GF-Linux</span>
      </a>
    </span>
  </div>

</div>

<!-- Menu de contexto da árvore. Fora da .ide para não ser recortado por ela. -->
<div class="menu oculto" id="menu"></div>

<script type="module" src="./casca-principal.ts"></script>
</body>
</html>
