<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; script-src 'self'">
<title>Terminus</title>
<link rel="stylesheet" href="../design/fontes.css">
<link rel="stylesheet" href="../design/estilo-da-casca.css">
</head>
<body>

<div class="ide">

  <!-- P1.2 — barra de título limpa: só os controles em círculo, sem menu. -->
  <div class="tbar" id="tbar">
    <div class="lights">
      <button class="c1" id="btFechar" title="Fechar"></button>
      <button class="c2" id="btMinimizar" title="Minimizar"></button>
      <button class="c3" id="btMaximizar" title="Maximizar"></button>
    </div>
    <!-- A marca: o sigilo Jared-Linux. -->
    <span class="marca" aria-hidden="true">
      <img id="imgMarca" alt="">
    </span>
    <div class="doc" id="tituloDoc">Terminus</div>
  </div>

  <div class="main">

    <!-- Explorer / Plugins do Neovim / Configurações (ADR 0025) -->
    <nav class="act" id="act" aria-label="Barra de atividades">
      <button data-p="explorer" aria-selected="true" title="Explorer">
        <svg viewBox="0 0 24 24"><path d="M4 6h5.5l1.8 2H20v11H4z"/></svg></button>
      <button data-p="extensions" aria-selected="false" title="Plugins do Neovim">
        <svg viewBox="0 0 24 24"><path d="M4 4h6.5v6.5H4zM13.5 13.5H20V20h-6.5zM13.5 4H20v6.5h-6.5zM4 13.5h6.5V20H4z"/></svg></button>
      <button class="sp" data-p="config" aria-selected="false" title="Configurações">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="2.8"/><path d="M12 3.4v2.3M12 18.3v2.3M3.4 12h2.3M18.3 12h2.3M6 6l1.6 1.6M16.4 16.4L18 18M18 6l-1.6 1.6M7.6 16.4L6 18"/></svg></button>
    </nav>

    <aside class="side" id="side">
      <div class="hd">
        <span id="sideT">Explorer</span>
        <span class="acoes" id="sideAcoes"></span>
      </div>
      <div class="body" id="lateral"></div>
    </aside>
    <!-- Clicar de novo no ícone já selecionado fecha a lateral (Ctrl+B); o
         divisor ajusta a largura. -->
    <div class="divv" id="divLateral" role="separator" aria-orientation="vertical"
         title="Arraste para redimensionar (duplo clique volta ao padrão)"></div>

    <!-- Área central: editor + terminal dockável (ADR 0025). O #centro troca a
         direção do flex conforme a doca (direita / esquerda / baixo). -->
    <div class="centro" id="centro" data-doca="direita">
    <div class="stage" id="stage">
      <!-- Papel de parede: só atrás da área de escrita, nunca atrás da casca. -->
      <div class="fundoTela oculto" id="fundoTela"></div>
      <div class="vazio" id="vazio">
        <span class="marcaGrande" aria-hidden="true">
          <img id="imgMarcaGrande" alt="">
        </span>
        <p>Nenhuma pasta aberta.</p>
        <p class="dim">Abra uma pasta no Explorer para começar.</p>
      </div>

    </div>

    <!-- Fechado por padrão: divulgação progressiva. Abre no Ctrl+` , no botão da
         barra de estado, ou sozinho quando há saída para mostrar. A doca (rodapé,
         direita ou esquerda) fica lembrada entre sessões. -->
    <div class="divv oculto" id="divTerm" role="separator" aria-orientation="vertical"
         title="Arraste para redimensionar (duplo clique volta ao padrão)"></div>
    <aside class="painelTerm oculto" id="painel">
      <div class="ptabs" id="cabTerm" title="Arraste para mudar a doca">
        <span class="pt on">Terminal</span>
        <span class="r">
          <button id="btDocaBaixo" class="doca" title="Terminal no rodapé">&#9601;</button>
          <button id="btDocaDireita" class="doca" title="Terminal à direita">&#9621;</button>
          <button id="btDocaEsquerda" class="doca" title="Terminal à esquerda">&#9615;</button>
          <button id="btParar" title="Parar" disabled>&#9632;</button>
          <button id="btLimpar" title="Limpar">&#9645;</button>
          <button id="btFecharPainel" title="Fechar painel">&#10005;</button>
        </span>
      </div>
      <div class="term" id="term"></div>
      <!-- A linha de comando (ADR 0020). É um <input> de HTML, e não digitação
           dentro do xterm, de propósito: sem PTY não há eco nem readline do
           outro lado, então escrever no terminal significaria reimplementar
           cursor, seleção, colar e acentuação à mão. O campo do sistema já faz
           tudo isso — inclusive o teclado do Deck. -->
      <form class="linhaCmd" id="linhaCmd" autocomplete="off">
        <span class="promptCmd" id="promptCmd">&#10148;</span>
        <input id="entradaCmd" type="text" spellcheck="false" autocapitalize="off"
               placeholder="pip install pandas" aria-label="Comando" />
      </form>
    </aside>
    </div><!-- /centro -->

  </div>

  <!-- A barra de estado ficou com o essencial (ADR 0025): o terminal continua
       clicável, e à direita a marca do dono. O que saiu — ambiente do laboratório,
       codificação, versão do Python e "Ln, Col" — ou pertencia ao produto
       anterior, ou é o Neovim quem passa a dizer, na statusline dele. -->
  <div class="sbar">
    <button id="btPainel" title="Terminal (Ctrl+`)">Terminal</button>
    <span class="r">
      <a id="linkGithub" class="gh" href="#" title="Abrir o GitHub no navegador">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38
          0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95
          0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.4 7.4 0 014 0c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48
          0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
        <span id="nomeGithub">GF-Linux</span>
      </a>
    </span>
  </div>

</div>

<!-- Menu de contexto da árvore. Fora da .ide para não ser recortado por ela. -->
<div class="menu oculto" id="menu"></div>

<script type="module" src="./casca-principal.ts"></script>
</body>
</html>
