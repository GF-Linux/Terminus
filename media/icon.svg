<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
     stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- A marca da Bancada: um pico de cromatograma que também é o acento do
       cursor de texto. As duas coisas que o aplicativo faz — ler traço e
       escrever código — no mesmo desenho.

       Monocromática por regra (ADR 0005): a cor pertence ao dado, não à marca.
       O erlenmeyer que estava aqui virou o ícone do painel do catálogo, que é
       onde ele sempre quis dizer "bancada de laboratório". -->
  <path d="M2.6 16.4h4.5l2-4.3L12 3.2l2.9 8.9 2 4.3h4.5"/>
  <path d="M12 19.1v2.5" stroke-width="2.6"/>
</svg>
